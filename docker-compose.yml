services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Використовуємо вбудованого суперкористувача `postgres`, а не
      # кастомного юзера: на деяких зв'язках Postgres 16 + Docker Desktop
      # (спостерігалось на Apple Silicon) кастомний non-superuser інколи
      # не отримує прав на схему `public` навіть після чистої ініціалізації
      # (`GRANT ALL ON SCHEMA public` не допомагав) — P1010 "User was denied
      # access". Суперкористувач цю категорію проблем усуває повністю.
      # Для навчального/дев-проєкту (не для продакшн-БД із чужими даними)
      # це прийнятний і поширений компроміс.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    ports:
      # Порт хоста навмисно 5433, а не стандартний 5432: у розробників, які
      # вже мають локально встановлений PostgreSQL (Homebrew, Postgres.app
      # тощо), порт 5432 часто вже зайнятий — і всі підключення з хоста
      # (включно з `npx prisma db push`) тоді йдуть у ТОЙ локальний сервер
      # замість Docker-контейнера, з незрозумілою помилкою на кшталт
      # "User was denied access" (бо там немає ні потрібної бази, ні юзера).
      # Всередині мережі docker-compose (сервіс app→db) порт лишається
      # стандартним 5432 — це стосується лише проброшування на хост.
      - '5433:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d booking']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:booking@db:5432/booking?schema=public
      JWT_SECRET: replace-with-a-long-random-string-min-32-chars
      NODE_ENV: production
      NOTIFY_BEFORE_MINUTES: ${NOTIFY_BEFORE_MINUTES:-10}
    ports:
      - '3000:3000'

volumes:
  db_data:
